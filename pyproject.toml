[project]
name = "loworbit"
version = "0.1.0"
description = "Low Orbit: a programmed piece of electronic music with a film of low Earth orbit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[project.scripts]
loworbit-sketch = "loworbit.sketch:render"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loworbit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The music text of the work has long lines: one bar or one phrase for each line.
"src/loworbit/work/*.py" = ["E501"]
"tools/listen.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
